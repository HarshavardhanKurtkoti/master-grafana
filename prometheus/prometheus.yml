global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

# Alertmanager configuration (optional / extensible)
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

# Load rules once and periodically evaluate them according to the global 'evaluation_interval'.
rule_files:
  # - "rules/*.yml"

scrape_configs:
  # Scrape Prometheus itself
  - job_name: "prometheus"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          service: "prometheus"
          environment: "production"

  # Scrape Grafana internal metrics
  - job_name: "grafana"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["grafana:3000"]
        labels:
          service: "grafana"
          environment: "production"

  # Scrape Harshavardhan Kurtkoti Portfolio Website (harshakurtkoti.in)
  - job_name: "portfolio_website"
    scrape_interval: 15s
    scrape_timeout: 10s
    metrics_path: "/api/metrics"
    scheme: "https"
    static_configs:
      - targets: ["harshakurtkoti.in"]
        labels:
          service: "portfolio-website"
          domain: "harshakurtkoti.in"
          environment: "production"
