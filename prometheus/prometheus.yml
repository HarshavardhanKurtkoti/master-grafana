global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

# Alertmanager configuration (optional / extensible)
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

# Load rules once and periodically evaluate them according to the global 'evaluation_interval'.
rule_files:
  # - "rules/*.yml"

scrape_configs:
  # Scrape Prometheus itself
  - job_name: "prometheus"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["127.0.0.1:9090"]
        labels:
          service: "prometheus"
          environment: "production"

  # Scrape Grafana internal metrics
  - job_name: "grafana"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["grafana:3000"]
        labels:
          service: "grafana"
          environment: "production"

  # Scrape Harshavardhan Kurtkoti Portfolio Website (harshakurtkoti.in)
  - job_name: "portfolio_website"
    scrape_interval: 15s
    scrape_timeout: 10s
    metrics_path: "/portfolio-telemetry/metrics"
    scheme: "https"
    static_configs:
      - targets: ["grafana.harshakurtkoti.in"]
        labels:
          service: "portfolio-website"
          domain: "harshakurtkoti.in"
          environment: "production"

  # Scrape Mnemora RAG Intelligence Platform (Local & Cloud)
  - job_name: "mnemora_rag"
    honor_labels: true
    scrape_interval: 10s
    scrape_timeout: 5s
    metrics_path: "/metrics"
    static_configs:
      - targets: ["host.docker.internal:8080"]
        labels:
          job: "mnemora_rag"
          environment: "production"
