[server]
http_addr = 0.0.0.0
http_port = 3000
protocol = http
domain = localhost
enforce_domain = false
enable_gzip = true

[security]
admin_user = admin
admin_password = admin
disable_gravatar = true
cookie_secure = false

[users]
allow_sign_up = false
auto_assign_org = true
auto_assign_org_role = Viewer

[auth.anonymous]
enabled = false

[analytics]
reporting_enabled = false
check_for_updates = false
feedback_links_enabled = false

[dashboards]
default_home_dashboard_path = /etc/grafana/provisioning/dashboards/json/prometheus-overview.json

[log]
mode = console
level = info
