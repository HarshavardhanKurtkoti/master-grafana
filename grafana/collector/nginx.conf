worker_processes 1;
pid /tmp/portfolio-nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    access_log off;
    client_body_temp_path /tmp/portfolio-client;
    proxy_temp_path /tmp/portfolio-proxy;
    fastcgi_temp_path /tmp/portfolio-fastcgi;
    uwsgi_temp_path /tmp/portfolio-uwsgi;
    scgi_temp_path /tmp/portfolio-scgi;
    map $http_upgrade $connection_upgrade { default upgrade; '' ''; }
    map $http_x_forwarded_proto $forwarded_proto { default $http_x_forwarded_proto; '' $scheme; }
    server {
        listen PUBLIC_PORT;
        client_max_body_size 0;
        location /portfolio-telemetry/ {
            client_max_body_size 32k;
            proxy_pass http://127.0.0.1:13001;
        }
        location /mnemora-telemetry/ {
            client_max_body_size 32k;
            proxy_pass http://127.0.0.1:13001;
        }
        location / {
            proxy_pass http://127.0.0.1:13000;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 1h;
            proxy_buffering off;
        }
    }
}
