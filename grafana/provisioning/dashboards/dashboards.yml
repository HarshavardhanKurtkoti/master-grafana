apiVersion: 1

providers:
  # 1. Root Level Dashboards (General Folder)
  - name: "Root"
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/json/root
      foldersFromFilesStructure: false

  # 2. Structured Project & Infrastructure Folders
  - name: "Structured Folders"
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/json/folders
      foldersFromFilesStructure: true
