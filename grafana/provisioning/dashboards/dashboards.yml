apiVersion: 1

providers:
  # Structured Project & Infrastructure Folders
  - name: "Structured Folders"
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/json/folders
      foldersFromFilesStructure: true
